name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      # The bundled offline basemap (app/src/main/assets/map/basemap.pmtiles) is git-ignored because
      # it is too large for git (>100MB). Generate it here before the build. Cache it across runs,
      # keyed on the build date + zoom in generate.sh, so it is only streamed once.
      - name: Cache basemap tileset
        id: cache-basemap
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/map/basemap.pmtiles
          key: basemap-${{ hashFiles('scripts/world-asset/generate.sh') }}

      - name: Generate basemap tileset
        if: steps.cache-basemap.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://github.com/protomaps/go-pmtiles/releases/download/v1.31.0/go-pmtiles_1.31.0_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" pmtiles
          export PATH="$RUNNER_TEMP:$PATH"
          bash scripts/world-asset/generate.sh

      # Sign with the same debug keystore as local builds so releases install as in-place updates.
      # Optional: set the DEBUG_KEYSTORE_BASE64 repo secret. Without it, a fresh debug key is
      # generated and users must uninstall before installing the new build.
      - name: Restore debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Unit tests (tile math + metrics)
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/squadventure-${TAG}.apk"
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Squadventure ${{ env.TAG }}
          generate_release_notes: true
          files: out/*.apk
